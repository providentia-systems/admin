name: Apply verified Admin resilience repairs
on:
  push:
    branches: [fix/step-2-response-configuration]
    paths: [.github/workflows/finish-admin-resilience.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - name: Apply the locally tested, checksum-verified source patch
        run: |
          set -euo pipefail
          cat .github/repair/admin.patch.gz.* | gzip -d > "$RUNNER_TEMP/admin.patch"
          printf '%s  %s\n' 4c20b3d253286d7d3022b19a473436da5919da0b2a7aec21fcb26f0dc327fd7d "$RUNNER_TEMP/admin.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/admin.patch"
          git apply "$RUNNER_TEMP/admin.patch"
          sed -i "s/if (requestId != null) 'requestId': requestId,/'requestId': ?requestId,/" lib/core/api/api_client.dart
          rm .github/repair/admin.patch.gz.*
          rm .github/workflows/finish-admin-resilience.yml
      - name: Install pinned Node runtime
        run: |
          bash tool/install_node_linux.sh "$RUNNER_TEMP/providentia-node"
          echo "$RUNNER_TEMP/providentia-node/node/bin" >> "$GITHUB_PATH"
      - name: Verify source and contracts
        run: bash tools/verify-structure.sh
      - name: Install pinned Flutter
        run: |
          bash tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"
      - name: Validate the complete application without weakening gates
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub --fatal-infos --fatal-warnings
          flutter test --no-pub --coverage
          node tool/check_coverage.mjs
      - name: Commit and fast-forward only this existing repair branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md lib test .github/repair .github/workflows/finish-admin-resilience.yml
          git diff --cached --check
          git commit -m 'fix(admin): recover sessions safely and traverse catalog queues without truncation'
          git push origin HEAD:refs/heads/fix/step-2-response-configuration
          git rev-parse HEAD
      - name: Retain test coverage only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admin-resilience-coverage
          path: coverage/lcov.info
          retention-days: 14
