name: Handover scoped edit validation
on:
  push:
    branches: [fix/handover-2026-09-22]
    paths: [tools/handover-apply.py]
permissions:
  contents: write
concurrency:
  group: handover-scoped-edit
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'providentia-systems/admin' && github.ref == 'refs/heads/fix/handover-2026-09-22'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply reviewed handover edits
        run: python3 tools/handover-apply.py
      - name: Install pinned toolchains
        run: |
          bash tool/install_node_linux.sh "$RUNNER_TEMP/providentia-node"
          echo "$RUNNER_TEMP/providentia-node/node/bin" >> "$GITHUB_PATH"
          bash tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"
      - name: Format and preserve source edits on the requested branch
        run: |
          set -euo pipefail
          dart format lib test
          git diff --check
          git add lib test docs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: type catalog workbench records and honor backend pagination'
            git push origin HEAD:refs/heads/fix/handover-2026-09-22
          fi
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Verify existing structural and contract boundaries
        run: bash tools/verify-structure.sh
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test
        run: flutter test --coverage
      - name: Enforce existing coverage gate
        run: node tool/check_coverage.mjs
