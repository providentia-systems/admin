name: Paired household contract refresh

on:
  push:
    branches: [fix/client-household-workflows]
    paths: [.github/workflows/household-contract-refresh.yml]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/client-household-workflows
          path: admin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: providentia-systems/backend
          ref: 4f7813ce21d90f03b3eec6c84ca907e32701640c
          path: backend
          persist-credentials: false
      - name: Copy the backend artifact and align operational documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib, json
          root = Path.cwd()
          archive = (root.parent / 'backend/contracts/source/providentia-v1.json.gz').read_bytes()
          raw = gzip.decompress(archive)
          digest = 'ef5714a6298326d6fb449b966117e8b61c74de67d1bfc274ad8ec431aecd802d'
          compressed = 'd20ba3f9b769b5e30e59f38ecb83816ff6825a9bb646509440fb731cfc012ff1'
          assert hashlib.sha256(raw).hexdigest() == digest
          assert hashlib.sha256(archive).hexdigest() == compressed
          (root / 'contracts/source/providentia-v1.json.gz').write_bytes(archive)
          (root / 'contracts/providentia-v1.json').write_bytes(raw)
          path = root / 'contracts/contract.lock.json'
          lock = json.loads(path.read_text())
          lock['apiVersion'] = lock['version'] = '2.2.0'
          lock['sha256'] = digest
          lock['artifacts']['providentia-v1.json']['sha256'] = digest
          path.write_text(json.dumps(lock, indent=2) + '\n')
          for name in ('tool/materialize_contract.sh', 'tool/verify_contract.mjs', 'tools/verify-structure.sh'):
              path = root / name
              path.write_text(path.read_text().replace('2.1.0', '2.2.0').replace('13ccdc2d37e73955394a7b7c52da6d9ff7aeefdfd763ac809876737867d15c44', digest).replace('bd106bdfd980823459ec3c769e8aad14cf6c2a2473b38c4708f9e59e635b34cd', compressed))
          path = root / 'docs/handover-implementation.md'
          path.write_text('# Historical Admin PR #12 implementation record\n\nThe following scope, digest and checks describe the earlier catalog-administration work. Current household metadata compatibility is documented in [Household workflows](household-workflows.md); this historical outstanding-work list is not the status of Client #21 or backend #25.\n\n' + path.read_text())
          path = root / 'docs/product-lifecycle-integration.md'
          source = path.read_text().replace('API 2.1.0', 'API 2.2.0')
          source = source.replace('The product name is Providentia.', 'The product name is Providentia. The PR references above describe the initial lifecycle baseline. Read [Household workflows](household-workflows.md) for current API 2.2.0 compatibility and the distinct Client/Admin editor scopes.', 1)
          path.write_text(source)
          (root / 'docs/household-workflows.md').write_text('# Household metadata compatibility — API 2.2.0\n\nAdmin mirrors the exact backend-owned API 2.2.0 artifact, JSON SHA-256 `' + digest + '`. Its generated facade remains the existing 92-operation operator allowlist; no household tenant mutation endpoints are added. Bindings are regenerated by the existing generator, never hand-edited.\n\nBackend #25 and household Client #21 add household-only name/pack overrides, explicit stock-unit labels, and selection of a published global or local category. The household Client exposes these controls in spaced scrollable forms, together with contextual stock-adjustment reasons. Private product changes retain identity, quantities, revision safeguards and synchronization history; shared catalog values are not rewritten. Global category selection does not publish a private product. Stock units are labels (units, g, kg, ml, l), not automatic balance/history conversions.\n\nThis Admin change is contract compatibility, not a replacement operator editor. Existing Admin catalog CRUD/search, reason controls and household private-product/category management remain unchanged. Backend operator stock responses expose effective household metadata; the broader operator customization editor remains a separate scope. The existing Admin update omits the new global/unit fields and therefore preserves those selections unless explicitly changed through a supported command.\n\nDeploy backend #25 and migration Version20260922000100 first using the normal deployment/migration procedure. Then build the paired Client and this Linux Admin against the intended API origin. Preserve recoverable application/database backups and do not reset data. Existing Admin format, static analysis, tests, coverage, security, Linux packaging and clean-host launch gates still apply. Installed-version and cross-device production acceptance are separate from source CI; these PRs do not deploy or merge themselves.\n')
          path = root / 'README.md'
          path.write_text(path.read_text() + '\nCurrent paired API and household editor boundaries: [Household metadata compatibility](docs/household-workflows.md).\n')
          PY
          node tool/generate_admin_api_client.mjs
          bash tools/verify-structure.sh
          git diff --check
      - name: Commit generated compatibility changes and remove this temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- contracts tool/materialize_contract.sh tool/verify_contract.mjs tools/verify-structure.sh README.md docs
          git rm -- .github/workflows/household-contract-refresh.yml
          git commit -m 'chore: align Admin bindings and documentation with household API 2.2.0'
          git push origin HEAD:fix/client-household-workflows
