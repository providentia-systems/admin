name: Admin quality

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, analyze, test and contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Node runtime
        run: |
          bash tool/install_node_linux.sh "$RUNNER_TEMP/providentia-node"
          bash tool/test_installer_cache_health.sh "$RUNNER_TEMP/providentia-node"
          echo "$RUNNER_TEMP/providentia-node/node/bin" >> "$GITHUB_PATH"

      - name: Verify source-only boundaries
        run: bash tools/verify-structure.sh

      - name: Install pinned Flutter SDK
        run: |
          mkdir -p "$RUNNER_TEMP/providentia-sdk/flutter/bin"
          printf '#!/bin/sh\nexit 99\n' > \
            "$RUNNER_TEMP/providentia-sdk/flutter/bin/flutter"
          chmod 0755 "$RUNNER_TEMP/providentia-sdk/flutter/bin/flutter"
          bash tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve locked dependencies
        run: |
          test -f pubspec.lock
          flutter pub get --enforce-lockfile

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --coverage

      - name: Enforce handwritten production coverage ratchet
        run: node tool/check_coverage.mjs

      - name: Produce dependency inventory
        run: |
          mkdir -p build/compliance
          dart pub deps --json > build/compliance/dart-dependencies.json

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: admin-quality-evidence
          path: |
            coverage/lcov.info
            build/compliance/dart-dependencies.json
          if-no-files-found: warn
          retention-days: 14

  linux-release-build:
    name: Linux release and packages
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Node runtime
        run: |
          bash tool/install_node_linux.sh "$RUNNER_TEMP/providentia-node"
          echo "$RUNNER_TEMP/providentia-node/node/bin" >> "$GITHUB_PATH"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake curl dpkg-dev libegl1 libgles2 libgtk-3-dev \
            liblzma-dev libsecret-1-dev ninja-build pkg-config

      - name: Test Linux release gates
        run: bash tool/test_linux_release_scripts.sh

      - name: Install pinned Flutter SDK
        run: |
          bash tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"

      - name: Build Linux release
        run: |
          flutter pub get --enforce-lockfile
          flutter build linux --release \
            --dart-define=PROVIDENTIA_API_BASE_URL=https://api.example.invalid

      - name: Package Linux release
        run: bash packaging/linux/build-packages.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: providentia-admin-linux
          path: build/packages
          if-no-files-found: error
          retention-days: 14

  linux-package-smoke:
    name: Clean-host Debian install and launch
    needs: linux-release-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out verification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: providentia-admin-linux
          path: build/packages

      - name: Install clean-host smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus-x11 desktop-file-utils xvfb

      - name: Verify checksums and install Debian package
        run: |
          (cd build/packages && sha256sum --check SHA256SUMS)
          deb="$(find build/packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          sudo apt-get install -y --no-install-recommends "$(realpath "$deb")"
          dpkg-query --show --showformat='${Status}\n' providentia-admin \
            | grep -Fqx 'install ok installed'

      - name: Verify native linkage and launch under Xvfb
        env:
          PROVIDENTIA_LINUX_INSTALLED_BINARY: /usr/bin/providentia_admin
          PROVIDENTIA_LINUX_LAUNCH_SMOKE: 'true'
        run: |
          deb="$(find build/packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          bash tool/verify_linux_deb.sh "$deb"
