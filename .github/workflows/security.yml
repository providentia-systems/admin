name: Admin security

on:
  pull_request:
  push:
    branches: [main, 'codex/**', 'feature/**']
  schedule:
    - cron: '29 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Scan complete Git history for credentials
        run: |
          mkdir -p build/security
          docker run --rm --entrypoint gitleaks \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.28.0 \
            detect --source /repo --redact --no-banner \
            --config /repo/.gitleaks.toml \
            --report-format sarif \
            --report-path /repo/build/security/gitleaks.sarif

      - name: Scan dependency graph, secrets and configuration
        run: |
          docker run --rm --entrypoint trivy \
            -v "$PWD:/workspace" \
            aquasec/trivy:0.65.0 \
            fs --scanners vuln,misconfig,secret \
            --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 \
            --format sarif \
            --output /workspace/build/security/trivy-filesystem.sarif \
            /workspace

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: admin-security-evidence-${{ github.sha }}
          path: build/security/*.sarif
          if-no-files-found: warn
          retention-days: 30

