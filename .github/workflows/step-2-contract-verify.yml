name: Step 2 admin verification
on:
  pull_request:
    paths:
      - .github/workflows/step-2-contract-verify.yml
      - test/features/step_2_inventory_identity_test.dart
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/step-2-response-configuration'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: providentia-systems/backend
          ref: b223bba83d23f42c70266bce6da7befc7fee3450
          path: _step2_backend
          persist-credentials: false
      - name: Install repository-pinned toolchains
        run: |
          bash tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"
          bash tool/install_node_linux.sh "$RUNNER_TEMP/providentia-node"
          echo "$RUNNER_TEMP/providentia-node/node/bin" >> "$GITHUB_PATH"
      - name: Regenerate exact backend-owned contract and preserve family regression
        run: |
          cp _step2_backend/contracts/source/providentia-v1.json.gz contracts/source/providentia-v1.json.gz
          python3 - <<'PY'
          import pathlib,hashlib,gzip
          p=pathlib.Path('contracts/source/providentia-v1.json.gz')
          archive=hashlib.sha256(p.read_bytes()).hexdigest()
          plain=hashlib.sha256(gzip.decompress(p.read_bytes())).hexdigest()
          assert archive=='beba4827515c2dc63f69145fad090769fea50a031c9f88f31bf2be4ddd951e55'
          assert plain=='b29608746e59216ef69554c346d0606ac5815e42a6e04d5f284872b608d05647'
          p=pathlib.Path('tool/materialize_contract.sh')
          p.write_text(p.read_text().replace('5e1e3f7224b85e52e09a298d2ad4c5a82d564c35d21d90e2b872bf33b3e9db8f',archive).replace('40a8477521baa6c41cf2c5d872068f5ae1bf255a8d0bbccc97a05688d705ad57',plain))
          PY
          bash tool/materialize_contract.sh
          node tool/generate_admin_api_client.mjs
          flutter pub get --enforce-lockfile
          dart format test/features/step_2_inventory_identity_test.dart
          git diff --check
          git rm .github/workflows/step-2-contract-verify.yml
          git add contracts tool/materialize_contract.sh lib/generated test/features/step_2_inventory_identity_test.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(step2): regenerate shared response contract and retain unresolved operator inventory'
          git push origin HEAD:fix/step-2-response-configuration
          git rev-parse HEAD > /tmp/SOURCE_COMMIT.txt
          git archive --format=tar.gz HEAD > /tmp/step2-admin-source.tar.gz
      - name: Install canonical Linux validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake curl dbus-x11 desktop-file-utils dpkg-dev libegl1 libgles2 libgtk-3-dev liblzma-dev libsecret-1-dev ninja-build pkg-config ripgrep xvfb
      - name: Canonical format, contract, analysis, tests, coverage, packages and launch
        run: bash tools/agent-check.sh > /tmp/step2-admin-check.log 2>&1
      - name: Preserve validation evidence and exact source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: step2-admin-verification
          path: |
            /tmp/SOURCE_COMMIT.txt
            /tmp/step2-admin-source.tar.gz
            /tmp/step2-admin-check.log
          retention-days: 14
