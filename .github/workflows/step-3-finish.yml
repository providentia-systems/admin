name: Step 3 corrective validation
on:
  pull_request:
    paths: ['.github/workflows/step-3-finish.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify raw contract and pin its archived encoding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import gzip,hashlib,re
          archive=Path('contracts/source/providentia-v1.json.gz')
          raw=gzip.decompress(archive.read_bytes())
          assert hashlib.sha256(raw).hexdigest()=='f6591ae866efbcc9e661528c7f595da0d7093d959d64c66c09b0c5be1dcb7c58'
          p=Path('tool/materialize_contract.sh')
          p.write_text(re.sub(r"ARCHIVE_SHA256='[a-f0-9]+'", "ARCHIVE_SHA256='"+hashlib.sha256(archive.read_bytes()).hexdigest()+"'",p.read_text()))
          PY
          bash tool/materialize_contract.sh
          node tool/verify_contract.mjs
      - run: |
          bash tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: |
          dart fix --apply --code=directives_ordering,curly_braces_in_flow_control_structures,prefer_initializing_formals
          dart format lib test
      - run: flutter analyze --no-pub --fatal-infos --fatal-warnings
      - name: Complete test and authentication suite
        if: success() || failure()
        run: flutter test --no-pub --reporter expanded > /tmp/step3-tests.log 2>&1
      - name: Capture corrected source and results
        if: always()
        run: |
          mkdir -p /tmp/step3-evidence
          git diff --binary HEAD -- . ':!.github/workflows/step-3-finish.yml' > /tmp/step3-evidence/reviewed-source.patch
          { git rev-parse HEAD; flutter --version; } > /tmp/step3-evidence/runtime.txt
          cp /tmp/step3-tests.log /tmp/step3-evidence/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: step3-admin-corrected
          path: /tmp/step3-evidence/
          retention-days: 7
  source:
    needs: test
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name step3-admin-corrected --dir "$RUNNER_TEMP/source"
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/fix/step-2-response-configuration --jq .object.sha)" = "$EXPECTED_HEAD"
          git apply --check "$RUNNER_TEMP/source/reviewed-source.patch"
          git apply "$RUNNER_TEMP/source/reviewed-source.patch"
          rm .github/workflows/step-3-finish.yml
          git config user.name 'Providentia source preparation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(step3): validate catalog publication navigation and paired archive'
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git push origin HEAD:refs/heads/fix/step-2-response-configuration
          git config --local --unset-all http.https://github.com/.extraheader
