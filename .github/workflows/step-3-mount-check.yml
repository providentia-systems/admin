name: Materialize explicit publication lifetime guards
on:
  pull_request:
    paths: ['.github/workflows/step-3-mount-check.yml']
permissions:
  contents: write
jobs:
  source:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/step-2-response-configuration'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Record explicit mounted guards, without executing application code
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/fix/step-2-response-configuration --jq .object.sha)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/features/catalog/catalog_page.dart');s=p.read_text()
          old='if (!_current(epoch)) return;'
          assert s.count(old)>=2
          s=s.replace(old,'if (!mounted || !_current(epoch)) return;')
          p.write_text(s)
          PY
          rm .github/workflows/step-3-mount-check.yml
          git config user.name 'Providentia source preparation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/catalog/catalog_page.dart .github/workflows/step-3-mount-check.yml
          git commit -m 'fix(step3): guard mounted state before async publication feedback'
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git push origin HEAD:refs/heads/fix/step-2-response-configuration
          git config --local --unset-all http.https://github.com/.extraheader
