name: Step 3 moderation navigation validation
on:
  pull_request:
    paths: ['tool/step3-navigation-finish.py', '.github/workflows/step-3-navigation-finish.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: python3 tool/step3-navigation-finish.py
      - run: |
          bash tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: |
          dart format lib test
          dart fix --apply --code=directives_ordering,curly_braces_in_flow_control_structures,unnecessary_import
          dart format lib test
      - run: flutter analyze --no-pub --fatal-infos --fatal-warnings
      - name: Full suite with pending queue to approved publication selection
        if: success() || failure()
        run: flutter test --no-pub --coverage --reporter expanded > /tmp/step3-tests.log 2>&1
      - name: Capture source and exact results
        if: always()
        run: |
          mkdir -p /tmp/step3-evidence
          git diff --binary HEAD -- . ':!tool/step3-navigation-finish.py' ':!.github/workflows/step-3-navigation-finish.yml' > /tmp/step3-evidence/reviewed-source.patch
          { git rev-parse HEAD; flutter --version; } > /tmp/step3-evidence/runtime.txt
          cp /tmp/step3-tests.log /tmp/step3-evidence/
          if test -f coverage/lcov.info; then cp coverage/lcov.info /tmp/step3-evidence/; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: step3-admin-navigation
          path: /tmp/step3-evidence/
          retention-days: 7
  source:
    needs: test
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name step3-admin-navigation --dir "$RUNNER_TEMP/source"
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/fix/step-2-response-configuration --jq .object.sha)" = "$EXPECTED_HEAD"
          git apply --check "$RUNNER_TEMP/source/reviewed-source.patch"
          git apply "$RUNNER_TEMP/source/reviewed-source.patch"
          rm tool/step3-navigation-finish.py .github/workflows/step-3-navigation-finish.yml
          git config user.name 'Providentia source preparation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(step3): keep moderation controls reachable and dialog state alive'
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git push origin HEAD:refs/heads/fix/step-2-response-configuration
          git config --local --unset-all http.https://github.com/.extraheader
